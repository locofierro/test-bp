<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS • grid animation preview</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #1e1e2f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }
        .app-container {
            display: flex;
            background: #2d2d3a;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            gap: 24px;
            flex-wrap: wrap;
            backdrop-filter: blur(2px);
        }
        canvas {
            display: block;
            border-radius: 20px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 10px 20px rgba(0,0,0,0.5);
        }
        .controls {
            width: 280px;
            background: #23232e;
            border-radius: 20px;
            padding: 20px 18px;
            color: #f0eef7;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.05), 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid #3a3a4b;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-row label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #b9b9d6;
            letter-spacing: 0.3px;
        }
        .control-row input, .control-row select {
            background: #16161e;
            border: 1px solid #3f3f55;
            border-radius: 40px;
            padding: 8px 14px;
            width: 130px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            outline: none;
            transition: 0.15s;
            text-align: right;
        }
        .control-row input[type=number] {
            -moz-appearance: textfield;
        }
        .control-row input:focus, .control-row select:focus {
            border-color: #9f7aea;
            box-shadow: 0 0 0 2px #4c3c6e;
        }
        .control-row select {
            background: #16161e;
            cursor: pointer;
        }
        .title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ddd6fe;
            border-left: 5px solid #b78aff;
            padding-left: 14px;
            letter-spacing: -0.2px;
        }
        .trail-hint {
            font-size: 0.75rem;
            color: #8d8db0;
            margin-top: 4px;
            text-align: right;
        }
        hr {
            border: none;
            height: 1px;
            background: #3a3a4f;
            margin: 8px 0;
        }
        .value-badge {
            background: #0e0e14;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #c5b4ff;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Pixi canvas will be inserted here -->
    <div id="pixi-stage" style="width: 1280px; height: 1024px; border-radius: 20px; overflow: hidden; background: #0c0c14;"></div>

    <!-- Right side controls -->
    <div class="controls">
        <div class="title">🐂 BP GRID ANIMATOR</div>
        <div class="control-group">
            <div class="control-row">
                <label>⬜ rect width</label>
                <input type="number" id="rectWidth" min="4" max="220" value="220" step="1">
            </div>
            <div class="control-row">
                <label>⬜ rect height</label>
                <input type="number" id="rectHeight" min="4" max="220" value="220" step="1">
            </div>
            <div class="control-row">
                <label>🔲 columns (W)</label>
                <input type="number" id="gridCols" min="1" max="5" value="5" step="1">
            </div>
            <div class="control-row">
                <label>🔲 rows (H)</label>
                <input type="number" id="gridRows" min="1" max="5" value="3" step="1">
            </div>
        </div>
        <hr>
        <div class="control-group">
            <div class="control-row">
                <label>🌀 animation mode</label>
                <select id="animMode">
                    <option value="0" selected>border</option>
                    <option value="1">middle</option>
                </select>
            </div>
            <div class="control-row">
                <label>✨ trail count</label>
                <input disabled type="number" id="trailCount" min="1" max="1024" value="256" step="1">
            </div>
            <div class="trail-hint">(256)</div>
            <div class="control-row">
                <label>🎨 shape</label>
                <select id="animShape">
                    <option value="0" selected>✨ sparks</option>
                    <option value="1">💓 heart</option>
                </select>
            </div>
            <div class="control-row">
                <label>💰 paylines</label>
                <select id="payLinesSelector">
                    <option value="0" selected>[1,1,1,1,1]</option>
                    <option value="1">[2,2,2,2,2]</option>
                    <option value="2">[0,0,0,0,0]</option>
                    <option value="3">[0,1,2,1,0]</option>
                    <option value="4">[2,1,0,1,2]</option>
                    <option value="5">[2,1,0,0,0]</option>
                    <option value="6">[0,1,2,2,2]</option>
                    <option value="7">[2,2,2,1,0]</option>
                    <option value="8">[0,0,0,1,2]</option>
                    <option value="9">[1,1,1,2,2]</option>
                </select>
            </div>
        </div>
        <hr>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-between;">
        </div>
    </div>
</div>

<!-- PixiJS library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.3/pixi.min.js" integrity="sha512-o3fAFcbCbTTJRFRNx4vByRZVtdKYF9uklctNjDXrN1JjT00rJxCCyNJSDi35rPBEqzWvYplcHLlEmyW34Ado8A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
